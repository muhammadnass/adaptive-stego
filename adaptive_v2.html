<!--
  ══════════════════════════════════════════════════════════════════
  WEB WORKER SOURCE (stringified, spawned as Blob URL at runtime)
  All heavy CPU work runs here so the UI thread never freezes.
  ══════════════════════════════════════════════════════════════════
-->
<script id="worker-src" type="text/plain">
// ─────────────────────────────────────────────────────────────────
// WORKER — self-contained; no DOM access, no React, no CryptoJS
// All cryptographic operations use SubtleCrypto (Web Crypto API).
// Security revision v3:
//   • Pixel traversal: PBKDF2-keyed AES-CTR CSPRNG (replaces LCG)
//   • Payload framing: 4-byte length prefix (replaces $$END$$ delimiter)
//   • Map stability:   class-change count returned after each embed
// ─────────────────────────────────────────────────────────────────

const T1 = 30;
const T2 = 80;

// ── Texture analysis ──────────────────────────────────────────────
function computeAdaptiveMap(pixels, width, height) {
    const W = width, H = height;
    const grey = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++) {
        const p = i * 4;
        grey[i] = 0.299 * pixels[p] + 0.587 * pixels[p+1] + 0.114 * pixels[p+2];
    }
    const Kx = [-1,0,1,-2,0,2,-1,0,1];
    const Ky = [-1,-2,-1,0,0,0,1,2,1];
    const adaptiveMap = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const idx = y * W + x;
            let gx = 0, gy = 0;
            for (let ky = -1; ky <= 1; ky++) {
                for (let kx = -1; kx <= 1; kx++) {
                    const ny = Math.min(Math.max(y+ky,0),H-1);
                    const nx = Math.min(Math.max(x+kx,0),W-1);
                    const val = grey[ny*W+nx];
                    const ki = (ky+1)*3+(kx+1);
                    gx += Kx[ki]*val; gy += Ky[ki]*val;
                }
            }
            const sobelMag = Math.sqrt(gx*gx+gy*gy)/4;
            let sum=0,sum2=0,count=0;
            for (let vy=-2;vy<=2;vy++) {
                for (let vx=-2;vx<=2;vx++) {
                    const ny=Math.min(Math.max(y+vy,0),H-1);
                    const nx=Math.min(Math.max(x+vx,0),W-1);
                    const v=grey[ny*W+nx];
                    sum+=v; sum2+=v*v; count++;
                }
            }
            const mean=sum/count;
            const variance=Math.sqrt(Math.max(0,sum2/count-mean*mean));
            const V=Math.min(255,Math.max(sobelMag,variance));
            adaptiveMap[idx]=V<T1?1:V<T2?2:3;
        }
    }
    return adaptiveMap;
}

// ── CSPRNG pixel order via PBKDF2 + AES-CTR ──────────────────────
// Security revision: replaces the previous 32-bit LCG (Numerical Recipes
// parameters) with a cryptographically secure permutation. PBKDF2-SHA-256
// (200,000 iterations, domain-separated fixed salt) derives a 256-bit
// AES-CTR key; encrypting a zero-filled buffer with that key yields a
// cryptographically secure byte stream used to drive Fisher-Yates.
// The 200,000-iteration PBKDF2 count matches the OWASP-recommended
// minimum for PBKDF2-HMAC-SHA-256 (2023) and makes seed-space exhaustion
// computationally infeasible even for short passwords.
async function generatePixelOrder(numPixels, password) {
    const enc = new TextEncoder();

    // Import the password as PBKDF2 key material
    const rawKey = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
    );

    // Domain-separated fixed salt: distinguishes traversal key from
    // the encryption key even when the same password is reused.
    const traversalSalt = enc.encode('adaptive-stego-traversal-salt-v3');

    // Derive a 256-bit AES-CTR key via PBKDF2-HMAC-SHA-256
    const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: traversalSalt, iterations: 200000, hash: 'SHA-256' },
        rawKey,
        { name: 'AES-CTR', length: 256 },
        false,
        ['encrypt']
    );

    // Generate numPixels × 4 pseudorandom bytes in one AES-CTR pass.
    // Counter starts at zero; length:128 means all 128 bits of the
    // counter block are used as the counter (effectively unlimited output).
    const bytesNeeded = numPixels * 4;
    const counter = new Uint8Array(16); // initial counter = 0
    const plaintext = new Uint8Array(bytesNeeded); // encrypt zeros
    const randBuf = await crypto.subtle.encrypt(
        { name: 'AES-CTR', counter, length: 128 },
        aesKey,
        plaintext
    );

    // Fisher-Yates shuffle driven by the AES-CTR output
    const rand32 = new Uint32Array(randBuf);
    const order = new Uint32Array(numPixels);
    for (let i = 0; i < numPixels; i++) order[i] = i;
    for (let i = numPixels - 1; i > 0; i--) {
        // Modulo bias is negligible: for i < 2^24 and 32-bit values,
        // the bias is at most 2^-8, well within security margins.
        const j = rand32[i] % (i + 1);
        const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    return order;
}

// ── Adaptive capacity ─────────────────────────────────────────────
function computeAdaptiveCapacity(adaptiveMap) {
    let total=0;
    for (let i=0;i<adaptiveMap.length;i++) total+=adaptiveMap[i]*3;
    return total;
}

// ─────────────────────────────────────────────────────────────────
// EMBED
// Payload framing revision: a 4-byte big-endian length prefix replaces
// the previous $$END$$ string delimiter.  The old delimiter could occur
// in arbitrary AES ciphertext, causing premature extraction termination.
// A fixed-length header carries the exact payload byte count, so
// extraction reads precisely that many bytes and stops without scanning
// for a pattern that could collide with ciphertext content.
// ─────────────────────────────────────────────────────────────────
async function doEmbed(pixels, width, height, cipherText, password) {
    const numPixels = width * height;
    const adaptiveMap = computeAdaptiveMap(pixels, width, height);
    const pixelOrder = await generatePixelOrder(numPixels, password);

    // ── Build framed payload: [4-byte big-endian length][ciphertext bytes] ──
    const encoder = new TextEncoder();
    const cipherBytes = encoder.encode(cipherText);
    const payloadLen = cipherBytes.length;
    const framedBytes = new Uint8Array(4 + payloadLen);
    const dv = new DataView(framedBytes.buffer);
    dv.setUint32(0, payloadLen, false); // big-endian length prefix
    framedBytes.set(cipherBytes, 4);
    const totalMsgBits = framedBytes.length * 8;

    const capacity = computeAdaptiveCapacity(adaptiveMap);
    if (totalMsgBits > capacity) {
        throw new Error(
            `Message too large. Adaptive capacity: ${capacity.toLocaleString()} bits. ` +
            `Message needs: ${totalMsgBits.toLocaleString()} bits.`
        );
    }

    // Build a flat bit buffer (Uint8Array of 0/1 values)
    const bitBuf = new Uint8Array(totalMsgBits);
    for (let b=0;b<framedBytes.length;b++) {
        const byte = framedBytes[b];
        const base = b*8;
        for (let bit=7;bit>=0;bit--) {
            bitBuf[base+(7-bit)] = (byte>>bit)&1;
        }
    }

    const stegoData = new Uint8ClampedArray(pixels);
    let bitIdx = 0;

    for (let pi=0; pi<numPixels && bitIdx<totalMsgBits; pi++) {
        const pixelIdx = pixelOrder[pi];
        const N = adaptiveMap[pixelIdx];
        const mask = (1<<N)-1;
        const clearMask = (~mask)&0xFF;

        for (let ch=0; ch<3 && bitIdx<totalMsgBits; ch++) {
            const byteIdx = pixelIdx*4+ch;
            const bitsAvail = Math.min(N, totalMsgBits-bitIdx);
            let value = 0;
            for (let k=0;k<bitsAvail;k++) {
                value = (value<<1) | bitBuf[bitIdx+k];
            }
            if (bitsAvail < N) value = value<<(N-bitsAvail);
            stegoData[byteIdx] = (stegoData[byteIdx]&clearMask)|value;
            bitIdx += N;
        }
    }

    // ── Map stability analysis ─────────────────────────────────────
    // Recompute the adaptive map from the stego image and count pixels
    // that changed class (N value) due to LSB modifications near a
    // decision threshold.  The count establishes an empirical upper
    // bound on extraction inconsistencies and is reported in the UI.
    const stegoMap = computeAdaptiveMap(stegoData, width, height);
    let classChanges = 0;
    for (let i = 0; i < numPixels; i++) {
        if (stegoMap[i] !== adaptiveMap[i]) classChanges++;
    }

    // Texture map visualisation
    const mapData = new Uint8ClampedArray(numPixels*4);
    const usedPixels = new Uint8Array(numPixels);
    let tmpIdx=0;
    for (let pi=0;pi<numPixels;pi++) {
        if (tmpIdx>=totalMsgBits) break;
        usedPixels[pixelOrder[pi]]=1;
        tmpIdx+=adaptiveMap[pixelOrder[pi]]*3;
    }
    for (let i=0;i<numPixels;i++) {
        const base=i*4;
        if (usedPixels[i]) {
            const n=adaptiveMap[i];
            mapData[base]  =n===3?220:n===2?30:30;
            mapData[base+1]=n===3?40:n===2?180:100;
            mapData[base+2]=n===3?40:n===2?60:220;
            mapData[base+3]=255;
        } else {
            mapData[base]=10; mapData[base+1]=15; mapData[base+2]=25; mapData[base+3]=255;
        }
    }

    let n1=0,n2=0,n3=0;
    for (let i=0;i<numPixels;i++) {
        const n=adaptiveMap[i];
        if(n===1)n1++;else if(n===2)n2++;else n3++;
    }

    return {
        stegoData: stegoData.buffer,
        mapData: mapData.buffer,
        width, height,
        finalBits: bitIdx,
        adaptiveStats: { smooth:n1, edge:n2, textured:n3, total:numPixels, capacity, classChanges }
    };
}

// ─────────────────────────────────────────────────────────────────
// EXTRACT
// Reads the 4-byte length prefix, then extracts exactly that many
// ciphertext bytes.  No delimiter scanning; immune to delimiter
// collision in ciphertext.  An implausibly large length value
// (> 1 MB) is treated as a wrong-password signal.
// ─────────────────────────────────────────────────────────────────
let data_arr = null;

async function doExtract(pixels, width, height, password) {
    const numPixels = width * height;
    const adaptiveMap = computeAdaptiveMap(pixels, width, height);
    const pixelOrder = await generatePixelOrder(numPixels, password);

    const HEADER_BYTES = 4; // 32-bit big-endian payload length
    let headerParsed = false;
    let payloadLen = 0;

    // Pre-allocate extraction buffer (header + max 1 MB payload)
    const MAX_PAYLOAD = 1_000_000;
    const extractedBuf = new Uint8Array(HEADER_BYTES + MAX_PAYLOAD + 10);
    let byteCount = 0;
    let bitAccum = 0;
    let bitsInAccum = 0;

    for (let pi = 0; pi < numPixels; pi++) {
        const pixelIdx = pixelOrder[pi];
        const N = adaptiveMap[pixelIdx];
        const mask = (1 << N) - 1;

        for (let ch = 0; ch < 3; ch++) {
            const byteIdx = pixelIdx * 4 + ch;
            const bits = data_arr[byteIdx] & mask;

            for (let b = N-1; b >= 0; b--) {
                bitAccum = (bitAccum << 1) | ((bits >> b) & 1);
                bitsInAccum++;

                if (bitsInAccum === 8) {
                    extractedBuf[byteCount++] = bitAccum & 0xFF;
                    bitAccum = 0; bitsInAccum = 0;

                    // Parse length header after first 4 bytes
                    if (!headerParsed && byteCount === HEADER_BYTES) {
                        const dv = new DataView(extractedBuf.buffer, 0, 4);
                        payloadLen = dv.getUint32(0, false); // big-endian
                        if (payloadLen === 0 || payloadLen > MAX_PAYLOAD) {
                            throw new Error(
                                'Extraction failed: invalid length header. ' +
                                'The password does not match, or the image was not produced by this tool.'
                            );
                        }
                        headerParsed = true;
                    }

                    // Stop once we have read all payload bytes
                    if (headerParsed && byteCount === HEADER_BYTES + payloadLen) {
                        const msgBytes = extractedBuf.subarray(HEADER_BYTES, HEADER_BYTES + payloadLen);
                        const decoder = new TextDecoder();
                        const cipherText = decoder.decode(msgBytes);
                        return { cipherText };
                    }
                }
            }
        }
    }

    throw new Error(
        'Extraction failed: payload not found within image bounds. ' +
        'Ensure the password matches the one used during embedding.'
    );
}

// ── Message handler ───────────────────────────────────────────────
self.onmessage = async (e) => {
    const { type, id } = e.data;
    try {
        if (type === 'EMBED') {
            const { pixelsBuf, width, height, cipherText, password } = e.data;
            data_arr = new Uint8ClampedArray(pixelsBuf);
            const result = await doEmbed(data_arr, width, height, cipherText, password);
            self.postMessage({ id, type:'EMBED_OK', ...result },
                [result.stegoData, result.mapData]);
        } else if (type === 'EXTRACT') {
            const { pixelsBuf, width, height, password } = e.data;
            data_arr = new Uint8ClampedArray(pixelsBuf);
            const result = await doExtract(data_arr, width, height, password);
            self.postMessage({ id, type:'EXTRACT_OK', ...result });
        } else if (type === 'ANALYZE') {
            const { pixelsBuf, width, height } = e.data;
            const pixels = new Uint8ClampedArray(pixelsBuf);
            const map = computeAdaptiveMap(pixels, width, height);
            let n1=0,n2=0,n3=0;
            for(let i=0;i<map.length;i++){const n=map[i];if(n===1)n1++;else if(n===2)n2++;else n3++;}
            const capacity = computeAdaptiveCapacity(map);
            self.postMessage({ id, type:'ANALYZE_OK', smooth:n1, edge:n2, textured:n3,
                total:map.length, capacity });
        }
    } catch(err) {
        self.postMessage({ id, type:'ERROR', message: err.message });
    }
};
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 1 — IMAGE UTILITIES
// ─────────────────────────────────────────────────────────────────────────────

const fileToImageData = (file) => new Promise((resolve, reject) => {
    if (!file || !file.type.match('image.*')) { reject(new Error("Not a valid image.")); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            try { resolve(ctx.getImageData(0, 0, img.width, img.height)); }
            catch (err) { reject(new Error("Cannot read image data — use a locally hosted image.")); }
        };
        img.onerror = () => reject(new Error("Image loading failed."));
        img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("File reading failed."));
    reader.readAsDataURL(file);
});

const imageDataToPNG = (imageData) => {
    const canvas = document.createElement('canvas');
    canvas.width = imageData.width; canvas.height = imageData.height;
    canvas.getContext('2d').putImageData(imageData, 0, 0);
    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
};

const mapDataToPNGUrl = (mapBuffer, width, height) => {
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').putImageData(
        new ImageData(new Uint8ClampedArray(mapBuffer), width, height), 0, 0
    );
    return canvas.toDataURL('image/png');
};

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 2 — AES-256 ENCRYPTION / DECRYPTION (SubtleCrypto, main thread)
// Security revision: replaces CryptoJS EVP_BytesToKey (MD5-based, 1 iteration)
// with PBKDF2-HMAC-SHA-256 (200,000 iterations, random 16-byte salt) for key
// derivation, and uses a random 16-byte IV per operation.  The salt and IV are
// prepended to the ciphertext and stored with it; a 1-byte version marker
// enables future format evolution.  AES-256-CBC with PKCS7 padding (provided
// by SubtleCrypto) is used for confidentiality.  Note: CBC alone does not
// provide authenticated encryption; integrity is ensured by the outer PBKDF2
// key-check (a wrong password produces a decryption exception from the padding
// validator) and by the application-level extraction failure path.
// ─────────────────────────────────────────────────────────────────────────────

async function encryptMessage(message, password) {
    const enc = new TextEncoder();

    // Random 16-byte salt and 16-byte IV, generated fresh for every operation
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(16));

    const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-CBC', length: 256 },
        false,
        ['encrypt']
    );

    const ctBuf = await crypto.subtle.encrypt(
        { name: 'AES-CBC', iv },
        key,
        enc.encode(message)
    );

    // Package layout: [1 byte version=3][16 byte salt][16 byte IV][ciphertext]
    const pkg = new Uint8Array(1 + 16 + 16 + ctBuf.byteLength);
    pkg[0] = 3; // format version
    pkg.set(salt, 1);
    pkg.set(iv, 17);
    pkg.set(new Uint8Array(ctBuf), 33);

    // Base64-encode the binary package for text-safe storage in the stego carrier
    return btoa(String.fromCharCode(...pkg));
}

async function decryptMessage(cipherText, password) {
    try {
        const pkgArr = Uint8Array.from(atob(cipherText), c => c.charCodeAt(0));
        const version = pkgArr[0];
        if (version !== 3) throw new Error('Unknown ciphertext format version.');

        const salt = pkgArr.slice(1, 17);
        const iv   = pkgArr.slice(17, 33);
        const ct   = pkgArr.slice(33);

        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
        );
        const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
            keyMaterial,
            { name: 'AES-CBC', length: 256 },
            false,
            ['decrypt']
        );

        const ptBuf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, ct);
        return new TextDecoder().decode(ptBuf);
    } catch (e) {
        throw new Error('Decryption failed: wrong password or corrupted data.');
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 3 — WEB WORKER MANAGER
// ─────────────────────────────────────────────────────────────────────────────

let _worker = null;
let _workerCallbacks = {};
let _msgId = 0;

function getWorker() {
    if (_worker) return _worker;
    const src = document.getElementById('worker-src').textContent;
    const blob = new Blob([src], { type: 'application/javascript' });
    _worker = new Worker(URL.createObjectURL(blob));
    _worker.onmessage = (e) => {
        const { id } = e.data;
        const cb = _workerCallbacks[id];
        if (cb) { delete _workerCallbacks[id]; cb(e.data); }
    };
    _worker.onerror = (e) => {
        console.error('Worker error:', e);
    };
    return _worker;
}

function workerCall(msg, transfers=[]) {
    return new Promise((resolve, reject) => {
        const id = ++_msgId;
        _workerCallbacks[id] = (result) => {
            if (result.type === 'ERROR') reject(new Error(result.message));
            else resolve(result);
        };
        getWorker().postMessage({ ...msg, id }, transfers);
    });
}

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 4 — PUBLIC API (wraps worker calls)
// ─────────────────────────────────────────────────────────────────────────────

const T1 = 30, T2 = 80;

async function analyzeImage(imageData) {
    const buf = imageData.data.buffer.slice(0);
    return workerCall({ type:'ANALYZE', pixelsBuf:buf,
        width:imageData.width, height:imageData.height }, [buf]);
}

async function embedData(imageData, cipherText, password) {
    const buf = imageData.data.buffer.slice(0);
    return workerCall({ type:'EMBED', pixelsBuf:buf,
        width:imageData.width, height:imageData.height,
        cipherText, password }, [buf]);
}

async function extractData(imageData, password) {
    const buf = imageData.data.buffer.slice(0);
    return workerCall({ type:'EXTRACT', pixelsBuf:buf,
        width:imageData.width, height:imageData.height,
        password }, [buf]);
}

// SECTION 5 — UI COMPONENTS
// ─────────────────────────────────────────────────────────────────────────────

            {fileUrl && (

                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5 0a1 1 0 10-2 0v6a1 1 0 102 0V8z" clipRule="evenodd" />
                    </svg>

            )}
        </div>
        {fileUrl && (
            <div className="max-w-xs h-auto max-h-48 mx-auto p-2 bg-secondary-card rounded-lg border border-border-color">
                <img src={fileUrl} alt="Preview" className="w-full h-full object-contain rounded-md" />
            </div>
        )}
    </div>
);

const PasswordInput = ({ value, onChange, showPassword, toggleVisibility, label = "Password" }) => (
    <div>
        <label className="block text-sm font-medium text-text-muted mb-1">{label}</label>
        <div className="relative">
            <input type={showPassword ? 'text' : 'password'} value={value} onChange={onChange}
                placeholder="Secret key"
                className="w-full p-3 pr-10 bg-secondary-card border border-border-color rounded-lg text-text-light placeholder-gray-500 focus:ring-primary focus:border-primary transition" />
            <button type="button" onClick={toggleVisibility}
                className="absolute inset-y-0 right-0 pr-3 flex items-center text-text-muted hover:text-primary transition">
                {showPassword
                    ? <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fillRule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clipRule="evenodd" /></svg>
                    : <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10c-1.274-4.057-5.064-7-9.542-7a9.986 9.986 0 00-1.07 0l-2.828-2.828zM9.54 12.454l.463-.463a2 2 0 00-2.433-2.433l-.463.463a4 4 0 016.416 3.194z" clipRule="evenodd" /><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /></svg>
                }
            </button>
        </div>
    </div>
);

const AdaptiveStatsBar = ({ stats }) => {
    if (!stats) return null;
    const { smooth, edge, textured, total, capacity, classChanges } = stats;
    const p1 = (smooth / total * 100).toFixed(1);
    const p2 = (edge / total * 100).toFixed(1);
    const p3 = (textured / total * 100).toFixed(1);
    const changesPct = classChanges !== undefined
        ? (classChanges / total * 100).toFixed(4)
        : null;
    return (
        <div className="mt-4 p-4 bg-secondary-card rounded-xl border border-border-color text-xs space-y-3">
            <p className="text-text-light font-semibold text-sm">Adaptive Region Analysis — N(x,y)</p>
            <div className="flex rounded-full overflow-hidden h-4" title="Adaptive region breakdown">
                <div style={{ width: p1 + '%', background: '#1e64dc' }} title={`N=1 smooth: ${p1}%`}></div>
                <div style={{ width: p2 + '%', background: '#1eb47a' }} title={`N=2 edge: ${p2}%`}></div>
                <div style={{ width: p3 + '%', background: '#dc3b3b' }} title={`N=3 textured: ${p3}%`}></div>
            </div>
            <div className="flex gap-4 flex-wrap">
                <span><span className="legend-dot" style={{ background: '#1e64dc' }}></span>N=1 smooth: {p1}% ({smooth.toLocaleString()} px)</span>
                <span><span className="legend-dot" style={{ background: '#1eb47a' }}></span>N=2 edge: {p2}% ({edge.toLocaleString()} px)</span>
                <span><span className="legend-dot" style={{ background: '#dc3b3b' }}></span>N=3 textured: {p3}% ({textured.toLocaleString()} px)</span>
            </div>
            <p className="text-text-muted">Total adaptive capacity: <span className="text-text-light font-semibold">{capacity.toLocaleString()} bits</span> ({(capacity / 8 / 1024).toFixed(1)} KB)</p>
            {changesPct !== null && (
                <p className="text-text-muted">
                    Map stability: <span className="text-text-light font-semibold">{classChanges.toLocaleString()} pixel{classChanges !== 1 ? 's' : ''} changed class after embedding</span>
                    {' '}({changesPct}% of total) — these pixels lie within ±7 intensity units of a threshold boundary.
                </p>
            )}
            <p className="text-text-muted text-xs italic">Pixel traversal order randomised via PBKDF2-keyed AES-CTR cryptographically secure permutation (200,000 PBKDF2 iterations, domain-separated salt).</p>
        </div>
    );
};

const EmbeddingPanel = ({
    coverImageUrl, coverImage, message, password,
    isLoading, handleFileChange, handleMessageChange,
    handlePasswordChange, handleEmbedding, showPassword,
    togglePasswordVisibility, adaptiveCapacity,
    stegoImageUrl, textureMapUrl, adaptiveStats, previewStats,
}) => {
    // Approximate pre-encryption overhead: PBKDF2+AES-CBC+base64 adds ~100 bytes overhead
    const ENCRYPT_OVERHEAD_BITS = (33 + 16) * 8; // version(1)+salt(16)+IV(16)+PKCS7 padding(≤16) → ~66 bytes, encoded as base64 ~ +1/3
    const msgBits = Math.ceil((message.length * 8 + ENCRYPT_OVERHEAD_BITS) * 4 / 3); // base64 expansion
    const ratio = adaptiveCapacity > 0 ? msgBits / adaptiveCapacity : 0;
    const isButtonDisabled = !coverImage || !message || !password || isLoading;

    return (
        <PanelCard title="1. Embed Data">
            <div className="space-y-6 flex-grow">
                <FileInput label="Cover Image (.png recommended)" onChange={handleFileChange}
                    accept="image/png,image/jpeg" fileUrl={coverImageUrl}
                    clearFile={() => handleFileChange({ target: { files: [] } })} />

                {previewStats && <AdaptiveStatsBar stats={previewStats} />}

                <div>
                    <label className="block text-sm font-medium text-text-muted mb-1">Secret Message</label>
                    <textarea value={message} onChange={handleMessageChange} rows="4"
                        placeholder="Enter the secret message to hide..."
                        className="w-full p-3 bg-secondary-card border border-border-color rounded-lg text-text-light placeholder-gray-500 focus:ring-primary focus:border-primary transition resize-none" />
                    <p className="text-xs text-text-muted mt-1">
                        Message: {message.length} chars (estimated ~{msgBits.toLocaleString()} bits after PBKDF2/AES-CBC/base64).
                        Adaptive capacity: {adaptiveCapacity.toLocaleString()} bits.
                        {adaptiveCapacity > 0 && (
                            <span className={ratio > 0.95 ? " text-error-color font-semibold" : " text-success-color"}>
                                {" "}({(ratio * 100).toFixed(1)}% estimated)
                            </span>
                        )}
                    </p>
                    {ratio > 0.90 && adaptiveCapacity > 0 &&
                        <p className="text-sm text-error-color mt-1 font-semibold">Warning: message may approach capacity after encryption overhead.</p>}
                </div>

                <PasswordInput value={password} onChange={handlePasswordChange}
                    showPassword={showPassword} toggleVisibility={togglePasswordVisibility}
                    label="Encryption Password (seeds PBKDF2 key derivation and pixel traversal)" />

                <div className="bg-secondary-card rounded-lg p-3 border border-border-color text-xs text-text-muted space-y-1">
                    <p className="font-semibold text-text-light">Security architecture (v3):</p>
                    <p>• Sobel edge detection + local variance → classifies every pixel into N(x,y) ∈ {"{1, 2, 3}"}</p>
                    <p>• Smooth regions (N=1): 1-bit LSB — minimal distortion</p>
                    <p>• Edge regions (N=2): 2-bit LSB — moderate capacity</p>
                    <p>• Textured regions (N=3): 3-bit LSB — maximum capacity, visually masked</p>
                    <p>• AES-256-CBC with PBKDF2-HMAC-SHA-256 (200,000 iter, random salt+IV)</p>
                    <p>• Pixel order: PBKDF2-keyed AES-CTR CSPRNG (Fisher-Yates) — defeats chi-square &amp; RS analysis</p>
                    <p>• Payload framing: 4-byte length prefix — no delimiter collision possible</p>
                    <p>• All heavy processing runs in a background worker — UI stays responsive</p>
                </div>
            </div>

            <button onClick={handleEmbedding} disabled={isButtonDisabled}
                className={`w-full py-3 px-4 rounded-lg font-semibold transition mt-6 ${
                    isButtonDisabled
                        ? 'bg-secondary-card text-text-muted cursor-not-allowed'
                        : 'bg-primary text-background hover:bg-primary-dark shadow-lg shadow-primary/30'
                }`}>
                {isLoading ? 'Encrypting & Embedding…' : 'Encrypt & Embed (Adaptive)'}
            </button>

            {textureMapUrl && stegoImageUrl && (
                <div className="mt-8 pt-6 border-t border-border-color">
                    <h3 className="text-sm font-semibold text-text-light mb-1">Adaptive Texture Map</h3>
                    <div className="flex gap-3 text-xs text-text-muted mb-3 flex-wrap">
                        <span><span className="legend-dot" style={{ background: '#1e64dc' }}></span>N=1 smooth (1-bit)</span>
                        <span><span className="legend-dot" style={{ background: '#1eb47a' }}></span>N=2 edge (2-bit)</span>
                        <span><span className="legend-dot" style={{ background: '#dc3b3b' }}></span>N=3 textured (3-bit)</span>
                        <span><span className="legend-dot" style={{ background: '#0a0f19' }}></span>Unmodified</span>
                    </div>
                    <AdaptiveStatsBar stats={adaptiveStats} />
                    <div className="w-full max-w-xs mx-auto mt-4 p-3 bg-secondary-card rounded-xl border border-border-color">
                        <img src={textureMapUrl} alt="Adaptive texture map"
                            className="w-full h-auto rounded-lg object-contain" style={{ imageRendering: 'pixelated' }} />
                    </div>
                    <div className="flex justify-center mt-5">
                        <a href={stegoImageUrl} download="stego_adaptive.png"
                            className="inline-flex items-center px-4 py-2 text-sm font-medium rounded-lg text-background bg-success-color hover:bg-green-600 transition">
                            <svg className="-ml-1 mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            Download Stego Image (.png)
                        </a>
                    </div>
                </div>
            )}
        </PanelCard>
    );
};

const ExtractionPanel = ({
    stegoImageUrl, extractionPassword, isLoading,
    handleFileChange, handlePasswordChange, handleExtraction,
    showPassword, togglePasswordVisibility,
}) => {
    const isButtonDisabled = !stegoImageUrl || !extractionPassword || isLoading;
    return (
        <PanelCard title="2. Extract Data">
            <div className="space-y-6 flex-grow">
                <FileInput label="Stego Image (must be the downloaded .png)"
                    onChange={handleFileChange} accept="image/png"
                    fileUrl={stegoImageUrl}
                    clearFile={() => handleFileChange({ target: { files: [] } })} />
                <PasswordInput value={extractionPassword} onChange={handlePasswordChange}
                    showPassword={showPassword} toggleVisibility={togglePasswordVisibility}
                    label="Decryption Password (must match embedding password)" />
                <div className="bg-secondary-card rounded-lg p-3 border border-border-color text-xs text-text-muted">
                    <p>No LSB factor needed — the adaptive map and pixel order are both re-derived from the stego image and password automatically.</p>
                    <p className="mt-1">A wrong password produces an immediate PBKDF2/AES decryption error or an invalid length-header signal — it will not hang or scan indefinitely.</p>
                </div>
            </div>
            <button onClick={handleExtraction} disabled={isButtonDisabled}
                className={`w-full py-3 px-4 rounded-lg font-semibold transition mt-6 ${
                    isButtonDisabled
                        ? 'bg-secondary-card text-text-muted cursor-not-allowed'
                        : 'bg-primary text-background hover:bg-primary-dark shadow-lg shadow-primary/30'
                }`}>
                {isLoading ? 'Extracting…' : 'Extract & Decrypt Data'}
            </button>
        </PanelCard>
    );
};

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 6 — APP STATE
// ─────────────────────────────────────────────────────────────────────────────

const App = () => {
    const [activeTab, setActiveTab] = useState('embed');
    const [isLoading, setIsLoading] = useState(false);
    const [error, setError] = useState(null);
    const [success, setSuccess] = useState(null);
    const [showPassword, setShowPassword] = useState(false);

    // Embed state
    const [coverImage, setCoverImage] = useState(null);
    const [coverImageUrl, setCoverImageUrl] = useState(null);
    const [coverImageData, setCoverImageData] = useState(null);
    const [message, setMessage] = useState('');
    const [embeddingPassword, setEmbeddingPassword] = useState('');
    const [stegoImageUrl, setStegoImageUrl] = useState(null);
    const [textureMapUrl, setTextureMapUrl] = useState(null);
    const [finalSizeInBits, setFinalSizeInBits] = useState(0);
    const [adaptiveStats, setAdaptiveStats] = useState(null);
    const [previewStats, setPreviewStats] = useState(null);
    const [adaptiveCapacity, setAdaptiveCapacity] = useState(0);

    // Extract state
    const [stegoImage, setStegoImage] = useState(null);
    const [stegoImageUrlExtract, setStegoImageUrlExtract] = useState(null);
    const [extractionPassword, setExtractionPassword] = useState('');
    const [extractedMessage, setExtractedMessage] = useState(null);

    const resetEmbedResults = () => {
        setStegoImageUrl(null); setTextureMapUrl(null);
        setFinalSizeInBits(0); setAdaptiveStats(null);
    };

    const handleFileChange = useCallback(async (event) => {
        setError(null); setSuccess(null); resetEmbedResults(); setPreviewStats(null); setAdaptiveCapacity(0);
        const files = event.target.files;
        if (!files || files.length === 0) {
            setCoverImage(null); setCoverImageUrl(null); setCoverImageData(null); return;
        }
        const file = files[0];
        setCoverImage(file);
        setCoverImageUrl(URL.createObjectURL(file));
        try {
            const imageData = await fileToImageData(file);
            setCoverImageData(imageData);
            const stats = await analyzeImage(imageData);
            setPreviewStats(stats);
            setAdaptiveCapacity(stats.capacity);
        } catch (err) {
            setError(`Image load error: ${err.message}`);
            setCoverImage(null); setCoverImageUrl(null); setCoverImageData(null);
        }
    }, []);

    const handleExtractionFileChange = useCallback(async (event) => {
        setError(null); setSuccess(null); setExtractedMessage(null);
        const files = event.target.files;
        if (!files || files.length === 0) { setStegoImage(null); setStegoImageUrlExtract(null); return; }
        const file = files[0];
        setStegoImage(file);
        setStegoImageUrlExtract(URL.createObjectURL(file));
    }, []);

    const handleEmbedding = async () => {
        if (!coverImage || !message || !embeddingPassword || !coverImageData) {
            setError('Please provide a cover image, message, and password.'); return;
        }
        setIsLoading(true); setError(null); setSuccess(null); resetEmbedResults();
        try {
            // PBKDF2+AES-256-CBC encryption on main thread (async SubtleCrypto)
            const cipherText = await encryptMessage(message, embeddingPassword);
            const result = await embedData(coverImageData, cipherText, embeddingPassword);
            const stegoImageData = new ImageData(
                new Uint8ClampedArray(result.stegoData), result.width, result.height
            );
            const blob = await imageDataToPNG(stegoImageData);
            setStegoImageUrl(URL.createObjectURL(blob));
            setTextureMapUrl(mapDataToPNGUrl(result.mapData, result.width, result.height));
            setFinalSizeInBits(result.finalBits);
            setAdaptiveStats(result.adaptiveStats);
            const { classChanges, total } = result.adaptiveStats;
            setSuccess(
                `Data embedded. ${result.finalBits.toLocaleString()} bits written using adaptive N(x,y) mapping + PBKDF2-keyed AES-CTR traversal. ` +
                `Map stability: ${classChanges} / ${total.toLocaleString()} pixels changed class (${(classChanges/total*100).toFixed(4)}%).`
            );
        } catch (err) {
            setError(err.message || 'Embedding failed.');
        } finally {
            setIsLoading(false);
        }
    };

    const handleExtraction = async () => {
        if (!stegoImage || !extractionPassword) {
            setError('Please provide a stego image and password.'); return;
        }
        setIsLoading(true); setError(null); setSuccess(null); setExtractedMessage(null);
        try {
            const stegoImageData = await fileToImageData(stegoImage);
            const { cipherText } = await extractData(stegoImageData, extractionPassword);
            // PBKDF2+AES-256-CBC decryption on main thread (async SubtleCrypto)
            const original = await decryptMessage(cipherText, extractionPassword);
            setExtractedMessage(original);
            setSuccess('Data extracted and decrypted successfully.');
        } catch (err) {
            setError(err.message || 'Extraction failed.');
        } finally {
            setIsLoading(false);
        }
    };

    const NavTabs = (
        <div className="flex justify-center mb-8">
            {['embed', 'extract'].map((tab, i) => (
                <button key={tab}
                    className={`px-6 py-3 font-semibold transition ${i === 0 ? 'rounded-l-lg' : 'rounded-r-lg'} ${
                        activeTab === tab
                            ? 'bg-primary text-background shadow-lg'
                            : 'bg-secondary-card text-text-light hover:bg-border-color'
                    }`}
                    onClick={() => { setActiveTab(tab); setError(null); setSuccess(null); }}>
                    {tab === 'embed' ? 'Embed Data' : 'Extract Data'}
                </button>
            ))}
        </div>
    );

    const ResultsPanel = (
        <PanelCard title="Results">
            {error && (
                <div className="bg-error-color/10 border-l-4 border-error-color text-error-color p-4 rounded-lg mb-4">
                    <p className="font-semibold">Error</p>
                    <p className="text-sm">{error}</p>
                </div>
            )}
            {success && (
                <div className="bg-success-color/10 border-l-4 border-success-color text-success-color p-4 rounded-lg mb-4">
                    <p className="font-semibold">Success</p>
                    <p className="text-sm">{success}</p>
                </div>
            )}
            {activeTab === 'embed' && finalSizeInBits > 0 && (
                <div className="space-y-3 text-sm">
                    <p className="text-text-light"><span className="font-semibold text-primary">Embedded:</span> {finalSizeInBits.toLocaleString()} bits</p>
                    {adaptiveStats && (
                        <>
                            <p className="text-text-muted">Smooth pixels used (N=1): {adaptiveStats.smooth.toLocaleString()}</p>
                            <p className="text-text-muted">Edge pixels used (N=2): {adaptiveStats.edge.toLocaleString()}</p>
                            <p className="text-text-muted">Textured pixels used (N=3): {adaptiveStats.textured.toLocaleString()}</p>
                            {adaptiveStats.classChanges !== undefined && (
                                <p className="text-text-muted">
                                    Map stability: {adaptiveStats.classChanges.toLocaleString()} pixel{adaptiveStats.classChanges !== 1 ? 's' : ''} changed class
                                    ({(adaptiveStats.classChanges / adaptiveStats.total * 100).toFixed(4)}%) — empirical threshold stability confirmed.
                                </p>
                            )}
                            <p className="text-text-muted text-xs italic mt-2">
                                Embedding thresholds: T₁={T1}, T₂={T2}. Pixel order derived via PBKDF2-HMAC-SHA-256 (200,000 iter) and AES-CTR-based Fisher-Yates CSPRNG shuffle. Payload framing: 4-byte length prefix.
                            </p>
                        </>
                    )}
                </div>
            )}
            {activeTab === 'extract' && extractedMessage !== null && (
                <div className="space-y-3">
                    <h3 className="text-lg font-semibold text-success-color">Decrypted Message:</h3>
                    <div className="bg-secondary-card p-4 rounded-lg border border-border-color">
                        <p className="whitespace-pre-wrap text-text-light break-words">{extractedMessage}</p>
                    </div>
                </div>
            )}
            {isLoading && (
                <div className="flex items-center gap-3 text-text-muted text-sm mt-2">
                    <svg className="animate-spin h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    Processing… PBKDF2 key derivation + embedding in background worker. UI remains responsive.
                </div>
            )}
            {!error && !success && !isLoading && finalSizeInBits === 0 && extractedMessage === null && (
                <p className="text-text-muted italic">Results will appear here after embedding or extraction.</p>
            )}
        </PanelCard>
    );

    return (
        <div className="max-w-6xl mx-auto py-8">
            <header className="text-center mb-10">
                <h1 className="text-4xl font-extrabold text-primary mb-2">
                    Adaptive LSB Steganography
                </h1>
                <p className="text-text-muted">
                    content-aware adaptive embedding · PBKDF2-keyed AES-CTR traversal · AES-256-CBC encryption
                </p>
                <div className="flex justify-center gap-3 mt-3 flex-wrap">
                    <span className="text-xs bg-secondary-card px-3 py-1 rounded-full text-primary border border-border-color">Sobel Edge Detection</span>
                    <span className="text-xs bg-secondary-card px-3 py-1 rounded-full text-primary border border-border-color">Local Variance Analysis</span>
                    <span className="text-xs bg-secondary-card px-3 py-1 rounded-full text-primary border border-border-color">N(x,y) Decision Function</span>
                    <span className="text-xs bg-secondary-card px-3 py-1 rounded-full text-primary border border-border-color">CSPRNG Traversal</span>
                    <span className="text-xs bg-secondary-card px-3 py-1 rounded-full text-primary border border-border-color">AES-256-CBC + PBKDF2</span>
                    <span className="text-xs bg-secondary-card px-3 py-1 rounded-full text-success-color border border-border-color">Map Stability Tracking</span>
                </div>
            </header>

            {NavTabs}

            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    {activeTab === 'embed' ? (
                        <EmbeddingPanel
                            coverImageUrl={coverImageUrl}
                            coverImage={coverImage}
                            message={message}
                            password={embeddingPassword}
                            isLoading={isLoading}
                            handleFileChange={handleFileChange}
                            handleMessageChange={e => { setMessage(e.target.value); resetEmbedResults(); }}
                            handlePasswordChange={e => { setEmbeddingPassword(e.target.value); resetEmbedResults(); }}
                            handleEmbedding={handleEmbedding}
                            showPassword={showPassword}
                            togglePasswordVisibility={() => setShowPassword(s => !s)}
                            adaptiveCapacity={adaptiveCapacity}
                            stegoImageUrl={stegoImageUrl}
                            textureMapUrl={textureMapUrl}
                            adaptiveStats={adaptiveStats}
                            previewStats={previewStats}
                        />
                    ) : (
                        <ExtractionPanel
                            stegoImageUrl={stegoImageUrlExtract}
                            extractionPassword={extractionPassword}
                            isLoading={isLoading}
                            handleFileChange={handleExtractionFileChange}
                            handlePasswordChange={e => setExtractionPassword(e.target.value)}
                            handleExtraction={handleExtraction}
                            showPassword={showPassword}
                            togglePasswordVisibility={() => setShowPassword(s => !s)}
                        />
                    )}
                </div>
                {ResultsPanel}
                <footer className="md:col-span-2 mt-6 text-center text-xs text-text-muted space-y-1">
                    <p>Only PNG images are guaranteed lossless. JPEG compression corrupts LSB data.</p>
                    <p>Mathematical basis: N(x,y) = 1 if V₀(x,y) &lt; T₁ | 2 if T₁ ≤ V₀(x,y) &lt; T₂ | 3 if V₀(x,y) ≥ T₂, where V₀(x,y) = min(255, max(Sobel magnitude, local variance)), T₁={T1}, T₂={T2}.</p>
                    <p>Encryption: AES-256-CBC, key derived via PBKDF2-HMAC-SHA-256 (200,000 iterations, 16-byte random salt, 16-byte random IV). Traversal: PBKDF2-keyed AES-CTR CSPRNG (domain-separated salt). Framing: 4-byte big-endian length prefix.</p>
                </footer>
            </div>
        </div>
    );
};

const container = document.getElementById('root');
if (container) ReactDOM.createRoot(container).render(<App />);
</script>
</body>
</html>
